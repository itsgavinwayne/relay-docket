[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "relay-audit"
version = "0.1.0"
description = "Audit an Anthropic-compatible relay against independently accessible Bedrock invocation logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2", "fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
relay-audit = "relay_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
